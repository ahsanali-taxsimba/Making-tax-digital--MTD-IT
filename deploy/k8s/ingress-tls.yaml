apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mtd-it
  annotations:
    nginx.ingress.kubernetes.io/ssl-protocols: "TLSv1.3"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/enable-owasp-modsecurity-crs: "true"
spec:
  tls:
    - hosts:
        - api.mtd.example
      secretName: mtd-tls
  rules:
    - host: api.mtd.example
      http:
        paths:
          - path: /metrics
            pathType: Prefix
            backend:
              service:
                name: mtd-api
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mtd-api
                port:
                  number: 8080
