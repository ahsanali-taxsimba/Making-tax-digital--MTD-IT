apiVersion: v1
kind: Secret
metadata:
  name: mtd-secrets
  namespace: mtd
type: Opaque
stringData:
  DATABASE_URL: postgresql://mtd:mtd@postgres:5432/mtd?schema=public
  JWT_ACCESS_SECRET: replace-me-access-secret-at-least-32-chars
  JWT_REFRESH_SECRET: replace-me-refresh-secret-at-least-32-chars
  JWT_MFA_SECRET: replace-me-mfa-secret-at-least-32-characters
  METRICS_TOKEN: replace-me-metrics-scrape-token-32-chars
  TOKEN_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
  TOKEN_ENCRYPTION_KEY_PREVIOUS: ""
  HMRC_SANDBOX_CLIENT_SECRET: ""
  HMRC_LIVE_CLIENT_SECRET: ""
  YAPILY_APPLICATION_SECRET: ""
  S3_ACCESS_KEY: ""
  S3_SECRET_KEY: ""
---
# Rotate TOKEN_ENCRYPTION_KEY by writing the old value to TOKEN_ENCRYPTION_KEY_PREVIOUS
# for one deploy, then removing the previous key after tokens have been rewritten.
