apiVersion: v1
kind: ConfigMap
metadata:
  name: mtd-config
  namespace: mtd
data:
  NODE_ENV: "production"
  PORT: "3000"
  HMRC_MODE: "sandbox"
  HMRC_ENVIRONMENT: "sandbox"
  HMRC_SANDBOX: "true"
  YAPILY_MODE: "mock"
  MFA_ENFORCE: "true"
  SWAGGER_ENABLED: "false"
  ALLOW_DB_SEED: "false"
  TLS_MIN_VERSION: "TLSv1.3"
  FRONTEND_ORIGIN: "https://app.mtd.example"
  APP_BASE_URL: "https://api.mtd.example"
