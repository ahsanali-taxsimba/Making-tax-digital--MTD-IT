name: making-tax-digital-mtd-it

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mtd
      POSTGRES_PASSWORD: mtd
      POSTGRES_DB: mtd
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mtd -d mtd"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://mtd:mtd@postgres:5432/mtd?schema=public
      APP_BASE_URL: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
