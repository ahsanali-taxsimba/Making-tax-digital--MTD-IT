worker_processes auto;

events {
    worker_connections 1024;
}

http {
    client_max_body_size 200M;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    server {
        listen 80;
        listen [::]:80;
        server_name simbaxbooks.co.uk www.simbaxbooks.co.uk;

        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name simbaxbooks.co.uk www.simbaxbooks.co.uk;

        # 🔐 SSL (ensure mounted in docker)
        ssl_certificate /etc/letsencrypt/live/simbaxbooks.co.uk/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/simbaxbooks.co.uk/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        client_max_body_size 200M;

        # headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # websocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_pass_header Set-Cookie;
        proxy_cookie_path / "/; Secure; HttpOnly; SameSite=None";

        # 🔵 API
        location /api/ {
            proxy_pass http://api:2326;

            proxy_http_version 1.1;
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;

            proxy_buffering off;
        }

        # 🟢 UI
        location / {
            proxy_pass http://ui:80;

            proxy_http_version 1.1;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}
